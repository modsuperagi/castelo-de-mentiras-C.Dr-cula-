# Super Evo Lab: monta o blog e publica no Cloudflare Pages (projeto castelo-blog).
# Roda quando algo em superevolab/ chega na main, ou à mão (aba Actions → Blog → Run workflow).
# Para publicar sozinho, o repositório precisa de dois segredos (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN  (token com permissão "Cloudflare Pages: Edit")
#   CLOUDFLARE_ACCOUNT_ID
# Sem eles, o site é montado e fica para baixar na própria execução (arquivo "castelo-blog-site").
name: Blog

on:
  push:
    branches: [main]
    paths: ["superevolab/**", ".github/workflows/blog.yml"]
  pull_request:
    paths: ["superevolab/**", ".github/workflows/blog.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superevolab
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: superevolab/package-lock.json
      - run: npm ci
      - run: npx next build
      - uses: actions/upload-artifact@v4
        with:
          name: castelo-blog-site
          path: superevolab/out
          retention-days: 14
      - name: Publicar no castelo-blog
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CF_TOKEN != '' && env.CF_CONTA != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: superevolab
          command: pages deploy out --project-name=castelo-blog --branch=main
      - name: Aviso
        if: github.event_name != 'pull_request' && (env.CF_TOKEN == '' || env.CF_CONTA == '')
        run: echo "::notice::Site montado. Para publicar sozinho no castelo-blog, cadastre CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos segredos do repositório."
